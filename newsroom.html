<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From the Newsroom — Helen Sievert</title>
<meta name="description" content="Journalism by Helen Sievert — clips from The Bourne Enterprise and its sister editions on Cape Cod.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;0,900;1,500;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="site-header"></div>

<div class="wrap">
  <section id="journalism">
    <div class="section-head"><h2>From the Newsroom</h2><span class="meta">Journalism</span></div>
    <p class="page-intro">Helen writes and copy-edits for the Enterprise newspapers on Cape Cod. Published clips are collected here.</p>
    <div id="journalism-body"></div>
  </section>
</div>

<div id="site-footer"></div>

<script>window.SITE_BASE="";window.SITE_PAGE="newsroom";</script>
<script src="site.js"></script>
<script src="data.js"></script>
<script>
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  var JOURNALISM = window.JOURNALISM || [];
  var box = document.getElementById('journalism-body');
  if(!JOURNALISM.length){
    box.innerHTML =
      '<div class="news-empty">' +
        '<span class="stamp">Coming Soon</span>' +
        '<p>Selected clips from <b>The Bourne Enterprise</b> and its sister editions — <em>The Falmouth</em>, <em>Sandwich</em>, and <em>Mashpee Enterprise</em> — will be posted here as they are collected.</p>' +
      '</div>';
  } else {
    box.innerHTML = '<div class="clip-list">' + JOURNALISM.map(function(c){
      var href = c.url || c.file || '#';
      var titleHtml = (href && href!=='#')
        ? '<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(c.title)+'</a>'
        : esc(c.title);
      var src = [c.publication, c.date].filter(Boolean).map(esc).join(' · ');
      return '<article class="clip-item">' +
        (src?'<div class="src">'+src+'</div>':'') +
        '<h3>'+titleHtml+'</h3>' +
        (c.blurb?'<p>'+esc(c.blurb)+'</p>':'') +
      '</article>';
    }).join('') + '</div>';
  }
</script>

</body>
</html>
